name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  ci:
    name: Type check, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Instalar dependencias
        run: npm ci

      # next-env.d.ts no está en el repo: lo genera typegen, y sin él tsc no conoce los tipos de Next.
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  imagen:
    name: Imagen, prueba de humo y Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build de la imagen
        run: docker build -t paneles:ci .

      - name: Prueba de humo (solo lectura, sin capacidades, 1001:1001)
        run: bash scripts/humo-imagen.sh paneles:ci

      - name: Instalar Trivy v0.71.0
        run: |
          TRIVY_SHA256="30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_Linux-64bit.tar.gz" \
            -O /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Trivy, informe completo (no bloquea)
        run: trivy image --exit-code 0 --severity HIGH,CRITICAL --vuln-type os,library paneles:ci

      - name: Trivy (gate)
        run: trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --vuln-type os,library paneles:ci

      # publicar sube esta misma imagen: así lo que llega a ghcr.io es lo que ha pasado la prueba y Trivy.
      - name: Guardar la imagen
        if: github.event_name == 'push'
        run: docker save paneles:ci | gzip > /tmp/imagen.tar.gz

      - name: Subir la imagen al run
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagen
          path: /tmp/imagen.tar.gz
          retention-days: 1

  publicar:
    name: Publicar en ghcr.io
    if: github.event_name == 'push'
    needs:
      - ci
      - imagen
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGEN: ghcr.io/aacienfuegos/paneles
    steps:
      - name: Bajar la imagen probada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagen
          path: /tmp

      - name: Cargar la imagen
        run: gunzip -c /tmp/imagen.tar.gz | docker load

      - name: Login a ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push
        run: |
          docker tag paneles:ci "$IMAGEN:$GITHUB_SHA"
          docker tag paneles:ci "$IMAGEN:latest"
          docker push "$IMAGEN:$GITHUB_SHA"
          docker push "$IMAGEN:latest"

      # El 102 despliega por digest: queda en el resumen del run para copiarlo al compose.
      - name: Digest
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGEN:$GITHUB_SHA")
          echo "Imagen publicada: \`$digest\` (commit \`$GITHUB_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
